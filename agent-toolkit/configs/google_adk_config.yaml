# Google ADK Configuration
# Copy this file and update with your credentials

# Option 1: Use Google Generative AI (Gemini API)
google_generative_ai:
  api_key: "${GOOGLE_API_KEY}"  # Set GOOGLE_API_KEY environment variable
  model_name: "gemini-pro"  # or "gemini-pro-vision" for multimodal
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.95
  top_k: 40

# Option 2: Use Vertex AI (for enterprise deployments)
vertex_ai:
  use_vertex_ai: false
  project_id: "your-gcp-project-id"
  location: "us-central1"
  credentials_path: "${GOOGLE_APPLICATION_CREDENTIALS}"  # Path to service account JSON
  model_name: "gemini-pro"
  temperature: 0.7
  max_tokens: 2048

# Default configuration (uses Google Generative AI if api_key is set)
default:
  use_vertex_ai: false
  model_name: "gemini-pro"
  temperature: 0.7
  max_tokens: 2048

